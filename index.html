<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pro Software Company Manager</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { borderRadius: { '2xl': '1.25rem' } } } };</script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Ef2m3w5XfG5lY5t6fQwrQm1QyX1wVY0b8t4x3y5rj3o5h1z+4h3yW8Zk7rBxN7X2JXlZ7QqM8u3+6FJ3xGmG0w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* Simple scrollbar */
    ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#9ca3af}
    .card{ @apply bg-white border rounded-2xl shadow-sm; }
    .btn{ @apply inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium bg-slate-900 text-white hover:bg-black disabled:opacity-50; }
    .btn-ghost{ @apply bg-slate-100 text-slate-900 hover:bg-slate-200; }
    .pill{ @apply text-xs px-2 py-0.5 rounded-full; }
    .pill-green{ @apply bg-emerald-100 text-emerald-700; }
    .pill-amber{ @apply bg-amber-100 text-amber-700; }
    .pill-red{ @apply bg-rose-100 text-rose-700; }
    .label{ @apply text-sm font-medium text-slate-700 mb-1; }
    .input{ @apply w-full border rounded-xl px-3 py-2 focus:outline-none focus:ring; }
    .textarea{ @apply w-full border rounded-xl px-3 py-2 focus:outline-none focus:ring; }
    .select{ @apply w-full border rounded-xl px-3 py-2 focus:outline-none focus:ring; }
    .grid-auto{ display:grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
    .link{ @apply text-sky-700 hover:underline; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="toggleSidebar" class="md:hidden p-2 rounded-lg border"><i class="fa-solid fa-bars"></i></button>
        <div class="font-bold text-xl" id="brandName">Team ABH PK Software</div>
      </div>
      <div class="hidden md:flex items-center gap-2 text-sm text-slate-600" id="brandMeta">info@teamabhpk.me • +92 300 0000000</div>
    </div>
  </header>

  <!-- Layout -->
  <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-[240px,1fr] gap-4">
    <!-- Sidebar -->
    <aside id="sidebar" class="card h-max p-2 hidden md:block">
      <nav id="nav" class="space-y-1">
        <!-- Filled by JS -->
      </nav>
    </aside>

    <!-- Main -->
    <main id="main">
      <!-- Sections injected by JS -->
    </main>
  </div>

  <footer class="text-center text-xs text-slate-500 py-8">© <span id="year"></span> <span id="brandNameFooter">Team ABH PK Software</span>. All rights reserved.</footer>

  <!-- App Script -->
  <script>
  (() => {
    const STORAGE_KEY = 'pro_scm_state_v2';
    const uid = () => Math.random().toString(36).slice(2,10);
    const today = () => new Date().toISOString().slice(0,10);
    const money = (n, curr='PKR') => new Intl.NumberFormat(undefined,{style:'currency',currency:curr,maximumFractionDigits:0}).format(Number(n||0));
    const qs = (sel, el=document) => el.querySelector(sel);
    const qsa = (sel, el=document) => [...el.querySelectorAll(sel)];

    const seed = () => ({
      company: { name: 'Team ABH PK Software', email:'info@teamabhpk.me', phone:'+92 300 0000000', address:'Pakistan', currency:'PKR',
        waTemplate: 'Assalam o Alaikum {name}\n\n{subject}\nDue: {due}\n{details}\n\nRegards, {company}',
        mailSubject: 'Update from {company}: {subject}',
        mailBody: 'Hi {name},\n\n{details}\n\nThanks,\n{company}',
      },
      team: [
        {id: uid(), kind:'employee', name:'Abdul Basit', role:'Founder / PM', email:'abdul@example.com', phone:'+923001234567', rateType:'salary', salary:180000, skills:['Android','Firebase','UI/UX'], status:'Active', joined: today() },
        {id: uid(), kind:'employee', name:'Ayesha Khan', role:'Frontend Dev', email:'ayesha@example.com', phone:'+923021112223', rateType:'salary', salary:150000, skills:['React','Tailwind'], status:'Active', joined: today() },
      ],
      freelancers: [
        {id: uid(), kind:'freelancer', name:'Ali Raza', specialty:'Backend Dev', email:'ali@example.com', phone:'+923331234567', rateType:'hourly', rate:2000, status:'Active', joined: today(), hoursMonth: 0 },
      ],
      clients: [
        {id: uid(), name:'GrozyMart', contact:'client@grozy.com', phone:'+92111111111', whats:'', address:'Lahore', notes:''},
      ],
      projects: [
        {id: uid(), name:'Grocery App', clientId: null, budget:1200000, status:'In Progress', start:today(), due:'2025-09-15', managerId: null},
      ],
      tasks: [
        {id: uid(), title:'Design checkout flow', projectId: null, assigneeId: null, assigneeKind:'employee', priority:'High', status:'Todo', due: '2025-08-25', estimateHrs:8, description:'Improve UX and validation.', created: today()},
      ],
      payroll: { history: [] }, // {month, currency, items:[{memberId, kind, base, bonus, deduct, hours, rate, net, paid}]}
      invoices: [], // {id, toType:'client'|'freelancer', toId, date, items:[{desc, qty, rate, amt}], total}
      attendance: {}, // {yyyy-mm-dd: { memberId: {in:'09:30', out:'17:30'} }}
      leaves: [],
      messages: [], // {id, date, toId, toKind, via:'wa'|'mail', subject, body}
    });

    // --- State management ---
    let state = load();
    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function load(){ try{ const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s||seed(); }catch(e){ return seed(); } }
    function reset(){ if(confirm('Reset all data?')){ state = seed(); save(); location.reload(); } }

    // --- Navigation ---
    const NAV = [
      {key:'dashboard', label:'Dashboard', icon:'fa-gauge-high'},
      {key:'team', label:'Team', icon:'fa-people-group'},
      {key:'freelancers', label:'Freelancers', icon:'fa-user-tie'},
      {key:'clients', label:'Clients', icon:'fa-handshake'},
      {key:'projects', label:'Projects', icon:'fa-diagram-project'},
      {key:'tasks', label:'Tasks', icon:'fa-list-check'},
      {key:'payroll', label:'Payroll', icon:'fa-sack-dollar'},
      {key:'invoices', label:'Invoices', icon:'fa-file-invoice-dollar'},
      {key:'attendance', label:'Attendance', icon:'fa-user-check'},
      {key:'leaves', label:'Leaves', icon:'fa-calendar-days'},
      {key:'messaging', label:'Messaging', icon:'fa-paper-plane'},
      {key:'reports', label:'Reports', icon:'fa-chart-line'},
      {key:'settings', label:'Settings', icon:'fa-gear'},
      {key:'importExport', label:'Import/Export', icon:'fa-file-arrow-up'},
    ];

    let current = 'dashboard';
    const navEl = qs('#nav');
    NAV.forEach(n=>{
      const btn = document.createElement('button');
      btn.className = 'w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-2';
      btn.innerHTML = `<i class="fa-solid ${n.icon} w-5 text-slate-600"></i><span>${n.label}</span>`;
      btn.addEventListener('click', () => { current = n.key; render(); });
      navEl.appendChild(btn);
    });

    // Header info
    qs('#year').textContent = new Date().getFullYear();
    qs('#brandName').textContent = state.company.name;
    qs('#brandNameFooter').textContent = state.company.name;
    qs('#brandMeta').textContent = `${state.company.email} • ${state.company.phone}`;
    qs('#toggleSidebar').addEventListener('click', ()=> qs('#sidebar').classList.toggle('hidden'))

    // --- Helpers ---
    const byId = (arr, id) => arr.find(x=>x.id===id);
    const dl = (filename, text, type='text/plain') => { const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url); };
    const fill = (tpl, map) => (tpl||'').replace(/\{(.*?)\}/g, (_,k)=> map[k] ?? '');
    const waLink = (phone, text) => `https://wa.me/${(phone||'').replace(/[^0-9]/g,'')}?text=${encodeURIComponent(text)}`;
    const mailto = (email, subject, body) => `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    // --- Render sections ---
    const main = qs('#main');

    function KPI(title, value, note){
      return `<div class="card p-4"><div class="text-sm text-slate-600">${title}</div><div class="text-3xl font-bold mt-1">${value}</div><div class="text-xs text-slate-500 mt-1">${note||''}</div></div>`;
    }

    function render(){
      save();
      const c = current;
      main.innerHTML = '';
      if(c==='dashboard') return renderDashboard();
      if(c==='team') return renderTeam();
      if(c==='freelancers') return renderFreelancers();
      if(c==='clients') return renderClients();
      if(c==='projects') return renderProjects();
      if(c==='tasks') return renderTasks();
      if(c==='payroll') return renderPayroll();
      if(c==='invoices') return renderInvoices();
      if(c==='attendance') return renderAttendance();
      if(c==='leaves') return renderLeaves();
      if(c==='messaging') return renderMessaging();
      if(c==='reports') return renderReports();
      if(c==='settings') return renderSettings();
      if(c==='importExport') return renderImportExport();
    }

    // ---- DASHBOARD ----
    function renderDashboard(){
      const openTasks = state.tasks.filter(t=>t.status!=='Done').length;
      const doneTasks = state.tasks.filter(t=>t.status==='Done').length;
      const activeProjects = state.projects.filter(p=>p.status!=='Completed').length;
      const members = state.team.length + state.freelancers.length;
      main.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          ${KPI('People', members, 'Employees + Freelancers')}
          ${KPI('Open Tasks', openTasks, 'Not done yet')}
          ${KPI('Completed Tasks', doneTasks, 'All time')}
          ${KPI('Active Projects', activeProjects, 'In progress or planned')}
        </div>
        <div class="card p-6 mt-4">
          <div class="text-lg font-semibold mb-2">Welcome to ${state.company.name}</div>
          <p class="text-slate-700">All-in-one manager for team, freelancers, clients, projects, tasks, payroll, invoices and messaging. Your data is saved in this browser using LocalStorage. You can export/import JSON anytime from <b>Import/Export</b>.</p>
          <div class="mt-3 flex flex-wrap gap-2">
            <button class="btn" onclick="location.hash='#tasks'">Quick: New Task</button>
            <button class="btn-ghost" onclick="(${reset.toString()})();">Reset Data</button>
          </div>
        </div>
      `;
    }

    // ---- TEAM ----
    function renderTeam(){
      const list = state.team;
      const rows = list.map(m=>`
        <div class="card p-4">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="font-semibold">${m.name}</div>
              <div class="text-sm text-slate-600">${m.role}</div>
              <div class="mt-1 flex flex-wrap gap-1">${(m.skills||[]).map(s=>`<span class='pill pill-green'>${s}</span>`).join('')}</div>
            </div>
            <span class="pill ${m.status==='Active'?'pill-green':'pill-amber'}">${m.status}</span>
          </div>
          <div class="text-sm text-slate-600 mt-3 space-y-1">
            <div>📧 ${m.email}</div>
            <div>📱 ${m.phone}</div>
            <div>💼 Salary: <b>${money(m.salary, state.company.currency)}</b></div>
            <div>📅 Joined: ${m.joined}</div>
          </div>
          <div class="flex gap-2 mt-4">
            <a class="btn" target="_blank" href="${waLink(m.phone, fill(state.company.waTemplate,{name:m.name,subject:'Update',due:today(),details:'Hello',company:state.company.name}))}"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a class="btn" href="${mailto(m.email, fill(state.company.mailSubject,{company:state.company.name,subject:'Update'}), fill(state.company.mailBody,{company:state.company.name,name:m.name,details:'Hello'}))}"><i class="fa-regular fa-envelope"></i> Email</a>
            <button class="btn-ghost" onclick="editTeam('${m.id}')">Edit</button>
            <button class="btn bg-rose-600 hover:bg-rose-700" onclick="delTeam('${m.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      main.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-slate-600">Total: ${list.length}</div>
          <button class="btn" onclick="editTeam()"><i class="fa-solid fa-plus"></i> Add Member</button>
        </div>
        <div class="grid-auto">${rows}</div>
      `;
    }

    // Expose small handlers for inline HTML usage
    window.editTeam = (id) => {
      const m = id ? byId(state.team,id) : {id:uid(), name:'', role:'', email:'', phone:'', rateType:'salary', salary:0, skills:[], status:'Active', joined: today()};
      openForm('Team Member', `
        ${input('Name','name',m.name)}
        ${input('Role','role',m.role)}
        ${input('Email','email',m.email,'email')}
        ${input('Phone','phone',m.phone)}
        ${select('Status','status',['Active','Inactive','Probation'], m.status)}
        ${input('Salary','salary',m.salary,'number')}
        ${input('Skills (comma separated)','skills',(m.skills||[]).join(', '))}
      `, (vals)=>{
        const rec = { ...m, ...vals, salary:Number(vals.salary||0), skills:(vals.skills||'').split(',').map(x=>x.trim()).filter(Boolean) };
        const exist = state.team.some(x=>x.id===rec.id);
        state.team = exist ? state.team.map(x=>x.id===rec.id?rec:x) : [rec, ...state.team];
        render();
      });
    };
    window.delTeam = (id)=>{ if(confirm('Delete member?')){ state.team = state.team.filter(m=>m.id!==id); render(); } };

    // ---- FREELANCERS ----
    function renderFreelancers(){
      const list = state.freelancers;
      const rows = list.map(f=>`
        <div class="card p-4">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="font-semibold">${f.name}</div>
              <div class="text-sm text-slate-600">${f.specialty}</div>
            </div>
            <span class="pill ${f.status==='Active'?'pill-green':'pill-amber'}">${f.status}</span>
          </div>
          <div class="text-sm text-slate-600 mt-3 space-y-1">
            <div>📧 ${f.email}</div>
            <div>📱 ${f.phone}</div>
            <div>💲 Rate: <b>${f.rateType==='hourly'? money(f.rate, state.company.currency)+'/hr' : money(f.rate, state.company.currency)}</b></div>
            <div>⏱️ Hours (this month): ${f.hoursMonth||0}</div>
          </div>
          <div class="flex gap-2 mt-4">
            <a class="btn" target="_blank" href="${waLink(f.phone, fill(state.company.waTemplate,{name:f.name,subject:'Task',due:today(),details:'Hello',company:state.company.name}))}"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a class="btn" href="${mailto(f.email, fill(state.company.mailSubject,{company:state.company.name,subject:'Task'}), fill(state.company.mailBody,{company:state.company.name,name:f.name,details:'Hello'}))}"><i class="fa-regular fa-envelope"></i> Email</a>
            <button class="btn-ghost" onclick="editFreelancer('${f.id}')">Edit</button>
            <button class="btn bg-rose-600 hover:bg-rose-700" onclick="delFreelancer('${f.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      main.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-slate-600">Total: ${list.length}</div>
          <div class="flex gap-2">
            <button class="btn" onclick="editFreelancer()"><i class="fa-solid fa-plus"></i> Add Freelancer</button>
            <button class="btn-ghost" onclick="logHoursFreelancer()"><i class="fa-regular fa-clock"></i> Log Hours</button>
          </div>
        </div>
        <div class="grid-auto">${rows}</div>
      `;
    }

    window.editFreelancer = (id) => {
      const f = id ? byId(state.freelancers,id) : {id:uid(), name:'', specialty:'', email:'', phone:'', rateType:'hourly', rate:0, status:'Active', joined:today(), hoursMonth:0};
      openForm('Freelancer', `
        ${input('Name','name',f.name)}
        ${input('Specialty','specialty',f.specialty)}
        ${input('Email','email',f.email,'email')}
        ${input('Phone','phone',f.phone)}
        ${select('Rate Type','rateType',['hourly','fixed'], f.rateType)}
        ${input('Rate','rate',f.rate,'number')}
        ${select('Status','status',['Active','Inactive'], f.status)}
      `, (vals)=>{
        const rec = { ...f, ...vals, rate:Number(vals.rate||0) };
        const exist = state.freelancers.some(x=>x.id===rec.id);
        state.freelancers = exist ? state.freelancers.map(x=>x.id===rec.id?rec:x) : [rec, ...state.freelancers];
        render();
      });
    }
    window.delFreelancer = (id)=>{ if(confirm('Delete freelancer?')){ state.freelancers = state.freelancers.filter(f=>f.id!==id); render(); } };
    window.logHoursFreelancer = ()=>{
      const options = state.freelancers.map(f=>`<option value='${f.id}'>${f.name}</option>`).join('');
      openForm('Log Hours (This Month)', `
        <label class='block mb-3'><div class='label'>Freelancer</div><select name='fid' class='select'>${options}</select></label>
        ${input('Hours','hours',0,'number')}
      `, (vals)=>{
        const f = byId(state.freelancers, vals.fid);
        f.hoursMonth = Number(f.hoursMonth||0) + Number(vals.hours||0);
        render();
      });
    }

    // ---- CLIENTS ----
    function renderClients(){
      const rows = state.clients.map(c=>`
        <div class="card p-4">
          <div class="flex items-start justify-between">
            <div>
              <div class="font-semibold">${c.name}</div>
              <div class="text-sm text-slate-600">${c.contact}</div>
            </div>
            <div class="text-xs text-slate-600">${c.phone||''}</div>
          </div>
          <div class="text-sm text-slate-600 mt-2">${c.address||''}</div>
          <div class="text-sm text-slate-600 mt-1">${c.notes||''}</div>
          <div class="flex gap-2 mt-3">
            <a class="btn" target="_blank" href="${waLink(c.phone||'', fill(state.company.waTemplate,{name:c.name,subject:'Project',due:today(),details:'Hello',company:state.company.name}))}"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a class="btn" href="${mailto(c.contact, fill(state.company.mailSubject,{company:state.company.name,subject:'Project'}), fill(state.company.mailBody,{company:state.company.name,name:c.name,details:'Hello'}))}"><i class="fa-regular fa-envelope"></i> Email</a>
            <button class="btn-ghost" onclick="editClient('${c.id}')">Edit</button>
            <button class="btn bg-rose-600 hover:bg-rose-700" onclick="delClient('${c.id}')">Delete</button>
          </div>
        </div>
      `).join('');
      main.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-slate-600">Total: ${state.clients.length}</div>
          <button class="btn" onclick="editClient()"><i class="fa-solid fa-plus"></i> New Client</button>
        </div>
        <div class="grid-auto">${rows}</div>
      `;
    }
    window.editClient = (id)=>{
      const c = id ? byId(state.clients,id) : {id:uid(), name:'', contact:'', phone:'', address:'', notes:''};
      openForm('Client', `
        ${input('Name','name',c.name)}
        ${input('Email','contact',c.contact,'email')}
        ${input('Phone','phone',c.phone)}
        ${input('Address','address',c.address)}
        ${textarea('Notes','notes',c.notes)}
      `, (vals)=>{
        const rec = {...c, ...vals};
        const exist = state.clients.some(x=>x.id===rec.id);
        state.clients = exist ? state.clients.map(x=>x.id===rec.id?rec:x) : [rec, ...state.clients];
        render();
      });
    }
    window.delClient = (id)=>{ if(confirm('Delete client?')){ state.clients = state.clients.filter(c=>c.id!==id); render(); } };

    // ---- PROJECTS ----
    function renderProjects(){
      const optsClient = ['<option value="">— None —</option>'].concat(state.clients.map(c=>`<option value='${c.id}'>${c.name}</option>`)).join('');
      const optsMgr = ['<option value="">— None —</option>'].concat(state.team.map(m=>`<option value='${m.id}'>${m.name}</option>`)).join('');
      const rows = state.projects.map(p=>{
        const client = p.clientId? byId(state.clients,p.clientId)?.name : '-';
        return `
          <div class="card p-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="font-semibold">${p.name}</div>
                <div class="text-sm text-slate-600">Client: ${client}</div>
              </div>
              <span class="pill ${p.status==='Completed'?'pill-green':p.status==='In Progress'?'pill-amber':'pill-red'}">${p.status}</span>
            </div>
            <div class="text-sm text-slate-600 mt-2">Budget: <b>${money(p.budget, state.company.currency)}</b></div>
            <div class="text-xs text-slate-500">${p.start} → ${p.due}</div>
            <div class="flex gap-2 mt-3">
              <button class="btn-ghost" onclick="editProject('${p.id}')">Edit</button>
              <button class="btn bg-rose-600 hover:bg-rose-700" onclick="delProject('${p.id}')">Delete</button>
            </div>
          </div>`;
      }).join('');
      main.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm text-slate-600">Total: ${state.projects.length}</div>
          <button class="btn" onclick="editProject()"><i class="fa-solid fa-plus"></i> New Project</button>
        </div>
        <div class="grid-auto">${rows}</div>
      `;
    }
    window.editProject = (id)=>{
      const p = id ? byId(state.projects,id) : {id:uid(), name:'', clientId:'', budget:0, status:'Planned', start:today(), due:today(), managerId:''};
      const clientOpts = ['<option value="">— None —</option>'].concat(state.clients.map(c=>`<option value='${c.id}'>${c.name}</option>`)).join('');
      const mgrOpts = ['<option value="">— None —</option>'].concat(state.team.map(m=>`<option value='${m.id}'>${m.name}</option>`)).join('');
      openForm('Project', `
        ${input('Name','name',p.name)}
        <label class='block mb-3'><div class='label'>Client</div><select name='clientId' class='select'>${clientOpts}</select></label>
        ${input('Budget','budget',p.budget,'number')}
        ${select('Status','status',['Planned','In Progress','On Hold','Completed'], p.status)}
        ${input('Start','start',p.start,'date')}
        ${input('Due','due',p.due,'date')}
        <label class='block mb-3'><div class='label'>Manager</div><select name='managerId' class='select'>${mgrOpts}</select></label>
      `, (vals)=>{

    window.runPayroll = (month)=>{
      if(state.payroll.history.find(h=>h.month===month)) return;
      const itemsEmp = state.team.map(m=>({ memberId:m.id, kind:'employee', base:Number(m.salary||0), bonus:0, deduct:0, net:Number(m.salary||0), paid:false }));
      const itemsFree = state.freelancers.map(f=>({ memberId:f.id, kind:'freelancer', base:0, bonus:0, deduct:0, hours:Number(f.hoursMonth||0), rate:Number(f.rate||0), net: Number(f.hoursMonth||0) * Number(f.rate||0), paid:false }));
      const items = [...itemsEmp, ...itemsFree];
      state.payroll.history.unshift({ month, currency: state.company.currency, items });
      render();
    }
    window.updatePayrollItem = (month, idx, key, val)=>{
      const run = state.payroll.history.find(h=>h.month===month); if(!run) return;
      const it = run.items[idx]; it[key] = Number(val||0);
      if(it.kind==='employee') it.net = Number(it.base||0) + Number(it.bonus||0) - Number(it.deduct||0);
      else it.net = (Number(it.hours||0)*Number(it.rate||0)) + Number(it.bonus||0) - Number(it.deduct||0);
      render();
    }
    window.markPaid = (month, idx)=>{ const run = state.payroll.history.find(h=>h.month===month); run.items[idx].paid=true; render(); }
    window.exportPayroll = (month)=>{
      const run = state.payroll.history.find(h=>h.month===month); if(!run) return;
      const header = 'Name,Kind,Base,Bonus,Deduct,Hours,Rate,Net,Paid';
      const lines = run.items.map(it=>{
        const mem = it.kind==='employee'? byId(state.team,it.memberId) : byId(state.freelancers,it.memberId);
        return [mem?.name||'-', it.kind, it.base||0, it.bonus||0, it.deduct||0, it.hours||0, it.rate||0, it.net||0, it.paid?'Yes':'No'].join(',');
      });
      dl(`payroll_${month}.csv`, [header,...lines].join('\n'), 'text/csv');
    }

    function calcHours(inT,outT){ if(!inT||!outT) return 0; const [ih,im]=inT.split(':').map(Number); const [oh,om]=outT.split(':').map(Number); const ms=(oh*60+om - (ih*60+im))*60*1000; return Math.max(0, ms)/(1000*60*60); }

      });
      const rowsTeam = state.team.map(m=> [m.name,m.role,m.email,m.phone,m.salary,m.status].join(','));
      const rowsFree = state.freelancers.map(f=> [f.name,f.specialty,f.email,f.phone,f.rateType+':'+f.rate,f.hoursMonth,f.status].join(','));
      main.innerHTML = `
        <div class='grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4'>
          ${KPI('Employees', state.team.length)}
          ${KPI('Freelancers', state.freelancers.length)}
          ${KPI('Clients', state.clients.length)}
          ${KPI('Projects', state.projects.length)}
          ${KPI('Open Tasks', state.tasks.filter(t=>t.status!=='Done').length)}
          ${KPI('Completed', state.tasks.filter(t=>t.status==='Done').length)}
          <div class='lg:col-span-3 card p-4'>
            <div class='flex flex-wrap gap-2'>
              <button class='btn' onclick='exportCSV("tasks.csv", "Title,Assignee,Priority,Status,Due\n${rowsTasks.join('\\n')}")'>Export Tasks CSV</button>
              <button class='btn-ghost' onclick='exportCSV("employees.csv", "Name,Role,Email,Phone,Salary,Status\n${rowsTeam.join('\\n')}")'>Export Employees CSV</button>
              <button class='btn-ghost' onclick='exportCSV("freelancers.csv", "Name,Specialty,Email,Phone,Rate,Hours,Status\n${rowsFree.join('\\n')}")'>Export Freelancers CSV</button>
            </div>
          </div>
        </div>`;
    }
    window.exportCSV = (name, data)=> dl(name, data, 'text/csv');

    // ---- SETTINGS ----
    function renderSettings(){
      const c = state.company;
      main.innerHTML = `
        <div class='grid grid-cols-1 lg:grid-cols-2 gap-4'>
          <div class='card p-4'>
            <div class='font-semibold mb-3'>Company Info</div>
            ${input('Name','c_name',c.name)}
            ${input('Email','c_email',c.email,'email')}
            ${input('Phone','c_phone',c.phone)}
            ${input('Address','c_address',c.address)}
            ${input('Currency (e.g., PKR, USD)','c_currency',c.currency)}
            <div class='flex justify-end mt-3'><button class='btn' onclick='saveCompany()'>Save</button></div>
          </div>
          <div class='card p-4'>
            <div class='font-semibold mb-3'>Message Templates</div>
            ${textarea('WhatsApp Template','c_wa',c.waTemplate)}
            ${input('Email Subject Template','c_msub',c.mailSubject)}
            ${textarea('Email Body Template','c_mbody',c.mailBody)}
            <div class='text-xs text-slate-600 mt-2'>Variables: {name}, {subject}, {due}, {details}, {company}</div>
            <div class='flex justify-end mt-3'><button class='btn' onclick='saveCompany()'>Save</button></div>
          </div>
        </div>`;
    }
    window.saveCompany = ()=>{
      state.company.name = qs('[name=c_name]').value;
      state.company.email = qs('[name=c_email]').value;
      state.company.phone = qs('[name=c_phone]').value;
      state.company.address = qs('[name=c_address]').value;
      state.company.currency = qs('[name=c_currency]').value||'PKR';
      state.company.waTemplate = qs('[name=c_wa]').value;
      state.company.mailSubject = qs('[name=c_msub]').value;
      state.company.mailBody = qs('[name=c_mbody]').value;
      qs('#brandName').textContent = state.company.name;
      qs('#brandNameFooter').textContent = state.company.name;
      qs('#brandMeta').textContent = `${state.company.email} • ${state.company.phone}`;
      save(); alert('Saved');
    }

    // ---- IMPORT / EXPORT ----
    function renderImportExport(){
      main.innerHTML = `
        <div class='grid grid-cols-1 lg:grid-cols-2 gap-4'>
          <div class='card p-4'>
            <div class='font-semibold mb-2'>Export Data</div>
            <p class='text-sm text-slate-600'>Download all your data as JSON for backup or migration.</p>
            <div class='mt-3'><button class='btn' onclick='exportJSON()'><i class="fa-regular fa-file"></i> Download JSON</button></div>
          </div>
          <div class='card p-4'>
            <div class='font-semibold mb-2'>Import Data</div>
            <p class='text-sm text-slate-600'>Paste JSON exported from this app. Import replaces current data.</p>
            <textarea id='importBox' class='textarea h-40' placeholder='{...}'></textarea>
            <div class='mt-3 flex gap-2'>
              <button class='btn' onclick='importJSON()'><i class="fa-solid fa-file-arrow-up"></i> Import</button>
              <button class='btn bg-rose-600 hover:bg-rose-700' onclick='(${reset.toString()})();'><i class="fa-solid fa-rotate"></i> Reset</button>
            </div>
          </div>
        </div>`;
    }
    window.exportJSON = ()=> dl('scm_data.json', JSON.stringify(state,null,2), 'application/json');
    window.importJSON = ()=>{ try{ const obj = JSON.parse(qs('#importBox').value); state = obj; save(); location.reload(); }catch(e){ alert('Invalid JSON'); } };

    // --- Generic modal form ---
    function openForm(title, inner, onSubmit){
      const wrap = document.createElement('div');
      wrap.className = 'fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4';
      wrap.innerHTML = `
        <div class='bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-auto'>
          <div class='flex items-center justify-between p-4 border-b'>
            <div class='text-lg font-semibold'>${title}</div>
            <button class='btn-ghost' onclick='this.closest(".fixed").remove()'>✕</button>
          </div>
          <form class='p-4 space-y-3'>
            ${inner}
            <div class='flex justify-end gap-2'>
              <button type='button' class='btn-ghost' onclick='this.closest(".fixed").remove()'>Cancel</button>
              <button class='btn' type='submit'>Save</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(wrap);
      wrap.querySelector('form').addEventListener('submit', (e)=>{
        e.preventDefault();
        const fd = new FormData(e.target); const vals = fromEntries(fd.entries()); onSubmit(vals); wrap.remove();.fromEntries(fd.entries());
        onSubmit(vals); wrap.remove();
      });
    }

    function input(label, name, value='', type='text'){ return `<label class='block'><div class='label'>${label}</div><input name='${name}' value='${value??''}' type='${type}' class='input'></label>`; }
    function textarea(label, name, value=''){ return `<label class='block'><div class='label'>${label}</div><textarea name='${name}' class='textarea' rows='5'>${value??''}</textarea></label>`; }
    function select(label, name, options, value){ return `<label class='block'><div class='label'>${label}</div><select name='${name}' class='select'>${options.map(o=>`<option ${o==value?'selected':''}>${o}</option>`).join('')}</select></label>`; }

    // Initial render
    render();

    // Support hash navigation (optional)
    window.addEventListener('hashchange', ()=>{
      const key = location.hash.replace('#','');
      if(NAV.some(n=>n.key===key)){ current = key; render(); }
    });
  // --- Form field helpers ---
    function input(label,name,value,type='text'){ return `<label class='block mb-3'><div class='label'>${label}</div><input class='input' name='${name}' type='${type}' value='${value??''}'/></label>` }
    function textarea(label,name,value){ return `<label class='block mb-3'><div class='label'>${label}</div><textarea class='textarea' name='${name}'>${value??''}</textarea></label>` }
    function select(label,name,options,selected){ return `<label class='block mb-3'><div class='label'>${label}</div><select class='select' name='${name}'>${options.map(o=>`<option ${o===selected?'selected':''}>${o}</option>`).join('')}</select></label>` }

    // --- Simple hash routing (optional) ---
    window.addEventListener('hashchange', ()=>{ const k = location.hash.replace('#',''); if(NAV.some(n=>n.key===k)){ current = k; render(); } });
    if(location.hash){ const k = location.hash.replace('#',''); if(NAV.some(n=>n.key===k)) current=k; }

    // Initial render
    render();

  })();
  <\/script>
</body>
