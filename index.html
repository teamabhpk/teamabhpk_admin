<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pro Software Company Manager — Firebase Edition</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* small tweaks */
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    .card{background:white;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,.06);border:1px solid rgba(2,6,23,.04)}
    .btn{display:inline-flex;gap:.5rem;align-items:center;padding:.5rem .75rem;border-radius:10px;background:#0f172a;color:#fff;font-weight:600}
    .btn-ghost{background:#f8fafc;color:#0f172a;padding:.45rem .7rem;border-radius:10px;border:1px solid #e6eef8}
    .input,.select,.textarea{width:100%;padding:.5rem .6rem;border-radius:8px;border:1px solid #e6eef8;background:#fff}
    .small{font-size:.85rem;color:#64748b}
    .pill{font-size:.75rem;padding:.2rem .5rem;border-radius:999px}
    .kanban-col{min-height:120px}
    @media (max-width:768px){ .md-hide{display:none} }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white border-b sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button id="menuToggle" class="md-hide p-2 rounded border"><i class="fa-solid fa-bars"></i></button>
        <div>
          <div id="brand" class="font-bold text-xl">Pro Software Company Manager</div>
          <div id="brandSub" class="small">Connect team • Manage tasks • Payroll & invoices</div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div id="userArea" class="hidden items-center gap-3">
          <div id="userName" class="small"></div>
          <button id="logoutBtn" class="btn-ghost"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
        <div id="authArea" class="flex items-center gap-2">
          <button id="loginBtn" class="btn-ghost"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
          <button id="signupBtn" class="btn-ghost"><i class="fa-regular fa-user"></i> Sign up</button>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-[260px,1fr] gap-4">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="card p-3 hidden md:block">
      <nav class="space-y-2" id="nav">
        <!-- items inserted by JS -->
      </nav>
      <div class="mt-4 text-xs small">
        <div id="companyQuick">No company configured — Settings → Company info</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main id="main" class="">
      <!-- content injected by JS -->
      <div class="card p-6">
        <h3 class="text-lg font-semibold">Loading app…</h3>
        <p class="small">If you just opened the app, please login and configure Firebase config inside the file.</p>
      </div>
    </main>
  </div>

  <footer class="text-center text-xs text-slate-500 py-6">© <span id="year"></span> Pro Software Manager</footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-analytics-compat.js"></script>

  <script>
  /*****************************************************************
   *  IMPORTANT:
   *  1) Create a Firebase project in console.firebase.google.com
   *  2) Enable Authentication (Email/Password and Google)
   *  3) Enable Firestore (native mode)
   *  4) Replace FIREBASE_CONFIG below with your project config (apiKey etc.)
   *****************************************************************/
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCxg2h3W6NLnaFurqtfN31IJjGQCGs7eDo",
  authDomain: "team-abh-pk-admin.firebaseapp.com",
  projectId: "team-abh-pk-admin",
  storageBucket: "team-abh-pk-admin.firebasestorage.app",
  messagingSenderId: "1034877264224",
  appId: "1:1034877264224:web:eb1b0baacd999b296fbe05",
  measurementId: "G-KQM0JND3Z8"
};
  // Initialize Firebase
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  // optional analytics: firebase.analytics();

  // Simple helper
  const uid = () => crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
  const today = () => new Date().toISOString().slice(0,10);
  const moneyFmt = (n,c='USD') => new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n||0));
  const el = (s)=>document.querySelector(s);
  const els = (s)=>[...document.querySelectorAll(s)];

  // App state
  let current = 'dashboard';
  const NAV = [
    {key:'dashboard',label:'Dashboard',icon:'fa-gauge-high'},
    {key:'team',label:'Team',icon:'fa-people-group'},
    {key:'freelancers',label:'Freelancers',icon:'fa-user-tie'},
    {key:'clients',label:'Clients',icon:'fa-handshake'},
    {key:'projects',label:'Projects',icon:'fa-diagram-project'},
    {key:'tasks',label:'Tasks',icon:'fa-list-check'},
    {key:'payroll',label:'Payroll',icon:'fa-sack-dollar'},
    {key:'invoices',label:'Invoices',icon:'fa-file-invoice-dollar'},
    {key:'attendance',label:'Attendance',icon:'fa-user-check'},
    {key:'leaves',label:'Leaves',icon:'fa-calendar-days'},
    {key:'messaging',label:'Messaging',icon:'fa-paper-plane'},
    {key:'reports',label:'Reports',icon:'fa-chart-line'},
    {key:'settings',label:'Settings',icon:'fa-gear'},
    {key:'backup',label:'Backup/Restore',icon:'fa-file-arrow-up'}
  ];

  // Render sidebar nav
  function renderNav(){
    const nav = el('#nav'); nav.innerHTML = '';
    NAV.forEach(n=>{
      const btn = document.createElement('button');
      btn.className = 'w-full text-left p-2 rounded hover:bg-slate-50 flex items-center gap-3';
      btn.innerHTML = `<i class="fa-solid ${n.icon} w-4"></i><span>${n.label}</span>`;
      btn.onclick = ()=>{ current=n.key; render(); if(window.innerWidth<768) el('#sidebar').classList.add('hidden'); };
      nav.appendChild(btn);
    });
  }

  // Authentication UI (modal simple)
  function openAuthModal(mode='login'){
    const wrap = document.createElement('div'); wrap.className='fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4';
    wrap.innerHTML = `<div class="bg-white rounded-2xl w-full max-w-md p-4">
      <div class="flex justify-between items-center mb-2"><h3 class="text-lg font-semibold">${mode==='login'?'Login':'Sign up'}</h3><button id="closeAuth" class="btn-ghost">✕</button></div>
      <form id="authForm" class="space-y-3">
        <label class="block small">Email <input name="email" class="input" type="email" required></label>
        <label class="block small">Password <input name="password" class="input" type="password" required></label>
        <div class="flex gap-2 justify-end"><button type="button" id="googleSign" class="btn-ghost">Sign with Google</button><button class="btn" type="submit">${mode==='login'?'Login':'Create'}</button></div>
      </form>
    </div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#closeAuth').addEventListener('click', ()=>wrap.remove());
    wrap.querySelector('#googleSign').addEventListener('click', async ()=>{
      const provider = new firebase.auth.GoogleAuthProvider();
      try{ await auth.signInWithPopup(provider); wrap.remove(); }catch(e){ alert(e.message); }
    });
    wrap.querySelector('#authForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = new FormData(e.target);
      const email = form.get('email'), pass = form.get('password');
      try{
        if(mode==='login'){ await auth.signInWithEmailAndPassword(email,pass); }
        else { await auth.createUserWithEmailAndPassword(email,pass); }
        wrap.remove();
      }catch(err){ alert(err.message); }
    });
  }

  // Basic layout renderers
  function setHeaderUser(user){
    if(user){
      el('#userArea').classList.remove('hidden'); el('#authArea').classList.add('hidden');
      el('#userName').textContent = user.displayName || user.email;
    } else {
      el('#userArea').classList.add('hidden'); el('#authArea').classList.remove('hidden');
    }
  }

  // Page render dispatcher
  async function render(){
    el('#year').textContent = new Date().getFullYear();
    renderNav();
    setHeaderUser(auth.currentUser);
    switch(current){
      case 'dashboard': return renderDashboard();
      case 'team': return renderTeam();
      case 'freelancers': return renderFreelancers();
      case 'clients': return renderClients();
      case 'projects': return renderProjects();
      case 'tasks': return renderTasks();
      case 'payroll': return renderPayroll();
      case 'invoices': return renderInvoices();
      case 'attendance': return renderAttendance();
      case 'leaves': return renderLeaves();
      case 'messaging': return renderMessaging();
      case 'reports': return renderReports();
      case 'settings': return renderSettings();
      case 'backup': return renderBackup();
      default: return renderDashboard();
    }
  }

  /* ===========================
     Real-time listeners & helpers
     =========================== */
  // We will snapshot collections on-demand rather than persistent listeners for simplicity.
  async function fetchCollection(name, whereClause=null){
    let q = db.collection(name);
    if(whereClause) q = q.where(...whereClause);
    const snap = await q.get();
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  }
  async function getDoc(collection, id){
    const d = await db.collection(collection).doc(id).get();
    return d.exists ? {id:d.id, ...d.data()} : null;
  }
  function saveDoc(collection, id, data){
    if(!id) return db.collection(collection).add(data);
    return db.collection(collection).doc(id).set(data, {merge:true});
  }
  function delDoc(collection, id){ return db.collection(collection).doc(id).delete(); }

  // Small modal form helper
  function openForm(title, innerHtml, onSubmit){
    const wrap = document.createElement('div'); wrap.className='fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4';
    wrap.innerHTML = `<div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-auto p-4">
      <div class="flex items-center justify-between mb-2"><h3 class="text-lg font-semibold">${title}</h3><button id="closeForm" class="btn-ghost">✕</button></div>
      <form id="modalForm" class="space-y-3">${innerHtml}
        <div class="flex justify-end gap-2 mt-2"><button type="button" id="cancelForm" class="btn-ghost">Cancel</button><button class="btn" type="submit">Save</button></div>
      </form>
    </div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#closeForm').addEventListener('click', ()=>wrap.remove());
    wrap.querySelector('#cancelForm').addEventListener('click', ()=>wrap.remove());
    wrap.querySelector('#modalForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      onSubmit(data);
      wrap.remove();
    });
  }

  /* ===========================
     Pages
     =========================== */

  // 1) Dashboard
  async function renderDashboard(){
    const [team, freelancers, clients, projects, tasks] = await Promise.all([
      fetchCollection('team'), fetchCollection('freelancers'), fetchCollection('clients'), fetchCollection('projects'), fetchCollection('tasks')
    ]);
    const openTasks = tasks.filter(t=>t.status!=='Done').length;
    const completed = tasks.filter(t=>t.status==='Done').length;
    const html = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <div class="card p-4"><div class="small">People</div><div class="text-2xl font-bold mt-1">${team.length + freelancers.length}</div><div class="small">Employees + Freelancers</div></div>
        <div class="card p-4"><div class="small">Open Tasks</div><div class="text-2xl font-bold mt-1">${openTasks}</div></div>
        <div class="card p-4"><div class="small">Completed</div><div class="text-2xl font-bold mt-1">${completed}</div></div>
        <div class="card p-4"><div class="small">Active Projects</div><div class="text-2xl font-bold mt-1">${projects.filter(p=>p.status!=='Completed').length}</div></div>
      </div>
      <div class="card p-4">
        <h3 class="font-semibold">Quick Actions</h3>
        <div class="mt-3 flex gap-2">
          <button class="btn" onclick="openQuick('task')"><i class="fa-solid fa-plus"></i> Quick Task</button>
          <button class="btn-ghost" onclick="current='projects'; render();">Manage Projects</button>
        </div>
      </div>
    `;
    el('#main').innerHTML = html;
  }

  // Quick action
  window.openQuick = (type)=>{
    if(type==='task'){
      openForm('Quick Task', `<label class="block small">Title<input name="title" class="input" required></label><label class="block small">Description<textarea name="description" class="textarea"></textarea></label>`, async (vals)=>{
        await saveDoc('tasks', null, {title:vals.title, description:vals.description, status:'Todo', priority:'Medium', createdAt: firebase.firestore.FieldValue.serverTimestamp()});
        alert('Task created'); render();
      });
    }
  };

  // 2) Team
  async function renderTeam(){
    const list = await fetchCollection('team');
    const rows = list.map(m=>`
      <div class="p-3 card mb-3">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold">${m.name||'(no name)'}</div>
            <div class="small">${m.role||''} • ${m.email||''}</div>
          </div>
          <div class="flex gap-2 items-center">
            <a target="_blank" href="https://wa.me/${(m.phone||'').replace(/\+/g,'')}" class="btn-ghost"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="mailto:${m.email||''}" class="btn-ghost"><i class="fa-regular fa-envelope"></i></a>
            <button class="btn-ghost" onclick="editTeam('${m.id}')">Edit</button>
            <button class="btn" style="background:#dc2626" onclick="deleteDocConfirm('team','${m.id}')">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
    el('#main').innerHTML = `<div class="flex items-center justify-between mb-3"><h3 class="text-lg font-semibold">Team</h3><div><button class="btn" onclick="addTeam()">+ Add Member</button></div></div>${rows||'<div class=\"card p-4 small\">No team members yet.</div>'}`;
  }
  window.addTeam = window.addTeam || function(){ addTeam(); }
  function addTeam(){
    openForm('Add Team Member', `
      <label class="block small">Name<input name="name" class="input" required></label>
      <label class="block small">Role<input name="role" class="input"></label>
      <label class="block small">Email<input name="email" class="input" type="email"></label>
      <label class="block small">Phone<input name="phone" class="input"></label>
      <label class="block small">Salary<input name="salary" class="input" type="number"></label>
      <label class="block small">Status<select name="status" class="select"><option>Active</option><option>Inactive</option></select></label>
    `, async (vals)=>{
      await saveDoc('team', null, {...vals, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
      alert('Saved'); render();
    });
  }
  window.editTeam = async (id)=>{
    const rec = await getDoc('team', id);
    openForm('Edit Team', `
      <input type="hidden" name="id" value="${rec.id}">
      <label class="block small">Name<input name="name" class="input" value="${rec.name||''}" required></label>
      <label class="block small">Role<input name="role" class="input" value="${rec.role||''}"></label>
      <label class="block small">Email<input name="email" class="input" type="email" value="${rec.email||''}"></label>
      <label class="block small">Phone<input name="phone" class="input" value="${rec.phone||''}"></label>
      <label class="block small">Salary<input name="salary" class="input" type="number" value="${rec.salary||0}"></label>
      <label class="block small">Status<select name="status" class="select"><option ${rec.status==='Active'?'selected':''}>Active</option><option ${rec.status==='Inactive'?'selected':''}>Inactive</option></select></label>
    `, async (vals)=>{
      await saveDoc('team', id, {...vals, salary: Number(vals.salary||0)});
      alert('Updated'); render();
    });
  }

  // 3) Freelancers (similar to team)
  async function renderFreelancers(){
    const list = await fetchCollection('freelancers');
    const rows = list.map(f=>`
      <div class="p-3 card mb-3">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-semibold">${f.name||'(no name)'}</div>
            <div class="small">${f.specialty||''} • ${f.email||''}</div>
          </div>
          <div class="flex gap-2 items-center">
            <a target="_blank" href="https://wa.me/${(f.phone||'').replace(/\+/g,'')}" class="btn-ghost"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="mailto:${f.email||''}" class="btn-ghost"><i class="fa-regular fa-envelope"></i></a>
            <button class="btn-ghost" onclick="editFreelancer('${f.id}')">Edit</button>
            <button class="btn" style="background:#dc2626" onclick="deleteDocConfirm('freelancers','${f.id}')">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
    el('#main').innerHTML = `<div class="flex items-center justify-between mb-3"><h3 class="text-lg font-semibold">Freelancers</h3><div><button class="btn" onclick="addFreelancer()">+ Add Freelancer</button></div></div>${rows||'<div class=\"card p-4 small\">No freelancers yet.</div>'}`;
  }
  function addFreelancer(){
    openForm('Add Freelancer', `
      <label class="block small">Name<input name="name" class="input" required></label>
      <label class="block small">Specialty<input name="specialty" class="input"></label>
      <label class="block small">Email<input name="email" class="input" type="email"></label>
      <label class="block small">Phone<input name="phone" class="input"></label>
      <label class="block small">Rate<input name="rate" class="input" type="number"></label>
      <label class="block small">Rate Type<select name="rateType" class="select"><option>hourly</option><option>fixed</option></select></label>
    `, async (vals)=>{
      await saveDoc('freelancers', null, {...vals, hoursMonth:0, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
      alert('Saved'); render();
    });
  }
  async function editFreelancer(id){
    const rec = await getDoc('freelancers', id);
    openForm('Edit Freelancer', `
      <label class="block small">Name<input name="name" class="input" value="${rec.name||''}" required></label>
      <label class="block small">Specialty<input name="specialty" class="input" value="${rec.specialty||''}"></label>
      <label class="block small">Email<input name="email" class="input" type="email" value="${rec.email||''}"></label>
      <label class="block small">Phone<input name="phone" class="input" value="${rec.phone||''}"></label>
      <label class="block small">Rate<input name="rate" class="input" type="number" value="${rec.rate||0}"></label>
      <label class="block small">Rate Type<select name="rateType" class="select"><option ${rec.rateType==='hourly'?'selected':''}>hourly</option><option ${rec.rateType==='fixed'?'selected':''}>fixed</option></select></label>
    `, async (vals)=>{
      await saveDoc('freelancers', id, {...vals, rate:Number(vals.rate||0
